spring.application.name=mobile-store-backend

# Server
server.port=8080

# MySQL Datasource (override via env vars in any real environment - defaults are dev-only)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mobile_store_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate - schema is now managed by Flyway migrations, not Hibernate auto-DDL.
# validate only checks entities match the DB schema at startup; it never alters it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# RabbitMQ (override via env vars in any real environment - defaults are dev-only)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=lkr

# JWT (override JWT_SECRET via env var in any real environment - this default is dev-only)
app.jwt.secret=${JWT_SECRET:dev-only-insecure-default-secret-please-override-via-env-var-min-32-chars}
app.jwt.expiration-ms=86400000

# Initial admin account, seeded once on first run if no admin exists yet.
# Override both via env vars before first startup in any real environment.
app.admin.seed-email=${ADMIN_EMAIL:change-me@example.com}
app.admin.seed-password=${ADMIN_SEED_PASSWORD:change-me}

# Auth is fully handled by our own JWT filter (JwtAuthFilter), not Spring's
# UserDetailsService/AuthenticationManager - suppress the unused default
# in-memory user Spring Boot would otherwise auto-generate on every startup.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# File storage - product images are stored via FileStorageService (see LocalFileStorageService).
# Swapping to S3/CDN later only requires a new FileStorageService implementation; callers are unaffected.
app.storage.location=${STORAGE_LOCATION:./uploads}
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:/uploads}

# Multipart upload limits (enforced again, more strictly, inside LocalFileStorageService)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Resend Email API Configuration (Pass API key via RESEND_API_KEY environment variable)
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:TechPulse Store <onboarding@resend.dev>}